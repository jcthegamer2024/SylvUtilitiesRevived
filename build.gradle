plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.1.0"
}

group = 'org.sylvarion'

repositories {
    mavenCentral()
    maven { url = "https://nexus.scarsz.me/content/groups/public/" }
    maven { url = "https://repo.nexomc.com/releases" }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.3.build.+")
    compileOnly("com.discordsrv:discordsrv:1.30.5")
    compileOnly("de.hexaoxi:carbonchat-api:3.0.0-beta.39")
    testImplementation("net.kyori:adventure-api:4.25.0")
    compileOnly("com.nexomc:nexo:1.29.1") { transitive = false }
    testImplementation("com.discordsrv:discordsrv:1.30.5")
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test { useJUnitPlatform() }

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.3")
        jvmArgs("-Dcom.mojang.eula.agree=true")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
