name: SylvUtilities
version: ${version}
main: org.sylvarion.sylvUtilities.SylvUtilities
api-version: '26.3'
load: POSTWORLD
authors: [ Akis, jcthegamer2024 ]
permissions:
  sylvutilities.reload:
    description: Reload SylvUtilities config and chat replacement mappings
    default: op
dependencies:
  server:
    CarbonChat:
      load: BEFORE
      required: false
      join-classpath: true
    DiscordSRV:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
